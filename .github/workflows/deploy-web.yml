name: Publicar Panel Web en Firebase Hosting

on:
  push:
    paths:
      - 'public/**'
      - 'firebase.json'
      - 'firestore.rules'
  workflow_dispatch:

jobs:
  deploy_hosting:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Desplegar Hosting y Reglas a Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::notice::Para publicar automáticamente public/admin.html y public/index.html en Firebase Hosting desde GitHub, agregá el secret FIREBASE_SERVICE_ACCOUNT (JSON de cuenta de servicio con rol Firebase Hosting Admin) en Settings -> Secrets -> Actions."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          npm install -g firebase-tools
          firebase deploy --only hosting,firestore:rules --project gen-lang-client-0699193083 --non-interactive
          rm -f /tmp/firebase-sa.json
