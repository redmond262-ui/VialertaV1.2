name: Compilar APK ViaAlerta

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Restaurar keystore de debug
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
          fi

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compilar APK Debug
        run: gradle :app:assembleDebug --no-daemon

      - name: Subir APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: ViaAlerta-v2.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
