name: Compilar APK ViaAlerta

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verificar google-services.json de Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '\r' > app/google-services.json
          fi
          if [ ! -s app/google-services.json ]; then
            echo "::error::Falta app/google-services.json (AI Studio lo excluye al exportar a GitHub). Agregá el Secret GOOGLE_SERVICES_JSON en Settings -> Secrets -> Actions."
            exit 1
          fi

      - name: Aceptar licencias y preparar Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          SDKMGR="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(command -v sdkmanager || true)"
          fi
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" --install "platform-tools" "build-tools;36.0.0" || true
            "$SDKMGR" --install "platforms;android-36.1" || "$SDKMGR" --install "platforms;android-36" || true
          fi

      - name: Reutilizar firma persistente en caché de GitHub
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: viaalerta-debug-keystore-v1

      - name: Preparar keystore y entorno
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > debug.keystore
          elif [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore || true
          fi
          if [ ! -s debug.keystore ]; then
            rm -f debug.keystore
            keytool -genkeypair -noprompt -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "=== COPIA ESTE SHA-1 EN FIREBASE CONSOLE ==="
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:" || true
          if [ ! -f .env ]; then
            touch .env
          fi

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compilar APK Debug
        run: gradle :app:assembleDebug --no-daemon --console=plain

      - name: Preparar APK con nombre fijo
        run: cp app/build/outputs/apk/debug/app-debug.apk ViaAlerta.apk

      - name: Subir APK descargable (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ViaAlerta-v2.2-APK
          path: ViaAlerta.apk
          if-no-files-found: error

      - name: Publicar en GitHub Releases (link permanente)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: VíaAlerta — Última Versión APK
          body: |
            Instalador oficial de **VíaAlerta** generado automáticamente desde el repositorio.
            Link permanente directo: `releases/latest/download/ViaAlerta.apk`
          files: ViaAlerta.apk
          make_latest: true
